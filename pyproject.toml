[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-execution-lab"
version = "0.1.0"
description = "A distributed stock-execution simulation laboratory"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[project.scripts]
market-execution-lab = "market_execution_lab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["services/engine/src"]
testpaths = ["tests"]
markers = [
  "integration: requires local Redis and PostgreSQL",
]

[tool.setuptools.packages.find]
where = ["services/engine/src"]
