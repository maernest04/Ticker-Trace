[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-execution-lab"
version = "0.1.0"
description = "A distributed stock-execution simulation laboratory"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[project.scripts]
market-execution-lab = "market_execution_lab.cli:main"
market-execution-replay = "market_execution_lab.replay_service:main"
market-execution-engine = "market_execution_lab.engine_service:main"
market-execution-persistence = "market_execution_lab.persistence_service:main"
market-execution-operations = "market_execution_lab.operations_service:main"
market-execution-ingestion = "market_execution_lab.ingestion_service:main"
market-execution-api = "market_execution_lab.api_service:main"
market-execution-worker = "market_execution_lab.worker_service:main"
market-execution-benchmark = "market_execution_lab.benchmark_service:main"
market-execution-validate = "market_execution_lab.validation_service:main"
market-execution-measure-live-peak = "market_execution_lab.live_peak_service:main"

[tool.pytest.ini_options]
pythonpath = ["services/engine/src"]
testpaths = ["tests"]
markers = [
  "integration: requires local Redis and PostgreSQL",
]

[tool.setuptools.packages.find]
where = ["services/engine/src"]
