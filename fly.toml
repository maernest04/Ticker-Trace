app = "replace-with-your-unique-fly-app-name"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  APP_MODE = "public_replay"
  PUBLIC_REQUEST_LIMIT = "60"

[processes]
  api = "market-execution-api"
  engine = "market-execution-engine --forever"
  persistence = "market-execution-persistence --forever"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/ready"
    timeout = "5s"

[[vm]]
  memory_mb = 512
  processes = ["api"]
  size = "shared-cpu-1x"

[[vm]]
  memory_mb = 256
  processes = ["engine", "persistence"]
  size = "shared-cpu-1x"
