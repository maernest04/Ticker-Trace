# fly.toml app configuration file generated for ticker-trace on 2026-10-01T18:51:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ticker-trace'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'alembic upgrade head'

[env]
  APP_MODE = 'public_replay'
  PUBLIC_REQUEST_LIMIT = '60'

[processes]
  api = 'market-execution-api'
  engine = 'market-execution-engine --forever'
  persistence = 'market-execution-persistence --forever'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['api']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/ready'

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['api']

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['engine', 'persistence']
