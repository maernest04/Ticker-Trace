app = "replace-with-your-unique-fly-app-name"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  APP_MODE = "public_replay"
  PUBLIC_REQUEST_LIMIT = "60"
  REPLAY_STATE_TTL_SECONDS = "900"
  WORKER_POLL_BLOCK_MS = "30000"
  FLY_WORKER_LIFECYCLE = "on"

[processes]
  api = "market-execution-api"
  engine = "env WORKER_ROLE=engine market-execution-worker"
  persistence = "env WORKER_ROLE=persistence market-execution-worker"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["api"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory_mb = 512
  processes = ["api"]
  size = "shared-cpu-1x"

[[vm]]
  memory_mb = 256
  processes = ["engine", "persistence"]
  size = "shared-cpu-1x"

[[restart]]
  policy = "on-failure"
  retries = 2
  processes = ["engine", "persistence"]
