services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickertrace
      POSTGRES_USER: tickertrace
      POSTGRES_PASSWORD: tickertrace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickertrace -d tickertrace"]
      interval: 5s
      timeout: 3s
      retries: 10
